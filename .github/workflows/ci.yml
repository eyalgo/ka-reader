# The wall, proven on every push: build the app, run the gates, then run the checks that read the built
# bundle and the machine it ran on.
#
# One job, one macOS image, every step fatal: a step that exits non-zero is the job's verdict, and the
# run is green only when every step exits 0. Nothing here supplies a way to sign and no repository
# secret is read; the bundle is ad-hoc signed by ka-reader-mac/assemble.sh alone.

name: CI

on:
  push:

permissions:
  contents: read

jobs:
  wall:
    runs-on: macos-26
    # The job builds with the image's own default Xcode; it selects none of its own.
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version && xcrun --show-sdk-version

      - name: Build the workspace
        run: cargo build --workspace --locked

      # The app build comes first: it writes the bridge artifact the Swift package links, which a
      # fresh checkout does not have, so the Test gate cannot run before it.
      - name: Build KA-Reader.app
        run: ka-reader-mac/assemble.sh

      - name: Test gate
        run: cargo test --workspace --locked && swift test --package-path ka-reader-mac

      - name: Structure check
        run: checks/structure.sh

      - name: Structure check suite
        run: checks/tests/test_structure.sh

      - name: Entry-points check
        run: checks/entry-points.sh

      - name: Entry-points check suite
        run: checks/tests/test_entry_points.sh

      - name: Bundle probe
        run: checks/bundle.sh target/release/bundle/macos/KA-Reader.app

      # The probe's negative control runs here: without it the probe has not run.
      - name: Bundle probe suite
        run: checks/tests/test_bundle.sh

      - name: View check
        run: checks/view.sh

      - name: View check suite
        run: checks/tests/test_view.sh

      # The gate runs its own idle-shell control: a run without the control has not run the gate.
      # Its launch of the product may leave the app's log behind before "Launch the built bundle" runs.
      - name: Renderer gate
        run: checks/renderer.sh target/release/bundle/macos/KA-Reader.app

      # The suite's real-bundle cases run the gate on the real bundle, and the gate refuses to launch
      # while an instance is running. "Launch the built bundle" leaves the app running, so this step
      # comes before it.
      - name: Renderer gate suite
        run: checks/tests/test_renderer.sh

      - name: Read-only, plain folder
        run: checks/read-only.sh checks/fixtures/plain

      - name: Read-only, repository
        run: checks/read-only.sh checks/fixtures/repo

      - name: Read-only, submodule
        run: checks/read-only.sh checks/fixtures/submodule

      - name: Read-only suite
        run: checks/tests/test_read_only.sh

      - name: No-network dependency list
        run: checks/no-network.sh

      - name: No-network suite
        run: checks/tests/test_no_network.sh

      - name: Own state suite
        run: checks/tests/test_own_state.sh

      # These three suites launch nothing, so they run before the real launch below.
      - name: VM refusal suite
        run: checks/tests/test_vm_refusal.sh

      - name: Launch step suite
        run: checks/tests/test_launch.sh

      - name: Own state step suite
        run: checks/tests/test_own_state_step.sh

      # The app's own log is written by a launch. Steps above this one launch the product, and each may
      # already have left the log behind: Bundle probe, Bundle probe suite, Renderer gate and Renderer
      # gate suite. Own state, the step that runs checks/own-state.sh against this runner's own home and
      # the app's real log, comes after this step and never before it.
      # Reading the app's container can wait on an operating-system consent prompt, so
      # checks/launch.sh holds the watchdog: it looks for the log in a child and counts a fixed number of
      # ticks, and names what it was reading when they run out. A step timeout would cancel the run and
      # name nothing.
      - name: Launch the built bundle
        run: checks/launch.sh

      # Last: it reads what the launch above left behind. checks/own-state-step.sh runs
      # checks/own-state.sh with the same bounded wait.
      - name: Own state
        run: checks/own-state-step.sh

      # After every gate: the bundle those gates ran on, handed out so someone who did not build it can
      # walk it in Finder (the-wall-holds condition 10). Zipped with ditto first, because an artifact
      # upload drops file modes and so would break the executable bit and the ad-hoc signature's seal.
      - name: Package KA-Reader.app
        run: ditto -c -k --keepParent target/release/bundle/macos/KA-Reader.app KA-Reader.app.zip

      - name: Upload KA-Reader.app
        uses: actions/upload-artifact@v6
        with:
          name: KA-Reader.app
          path: KA-Reader.app.zip
          if-no-files-found: error
