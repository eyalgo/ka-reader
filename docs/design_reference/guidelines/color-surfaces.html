<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Surfaces and overlays — Nozoki</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="specimen.css"></head>
<body>
<div class="p grid" style="grid-template-columns:repeat(4,1fr)">
<div><div style="height:56px;background:var(--surface-app);border:var(--hairline);border-radius:var(--radius-md)"></div><div class="k" style="margin-top:6px">--surface-app</div></div>
<div><div style="height:56px;background:var(--surface-panel);border:var(--hairline);border-radius:var(--radius-md)"></div><div class="k" style="margin-top:6px">--surface-panel</div></div>
<div><div style="height:56px;background:var(--surface-hover);border:var(--hairline);border-radius:var(--radius-md)"></div><div class="k" style="margin-top:6px">--surface-hover</div></div>
<div><div style="height:56px;background:var(--surface-selected);border:var(--hairline);border-radius:var(--radius-md)"></div><div class="k" style="margin-top:6px">--surface-selected</div></div>
</div>

</body></html>
