<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Interaction states — Nozoki</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="specimen.css"></head>
<body>
<div class="p"><div style="width:300px;background:var(--surface-sidebar);border:var(--hairline);border-radius:var(--radius-md);padding:4px 0">
<div style="height:26px;display:flex;align-items:center;padding-left:10px;font:var(--type-tree);color:var(--text-secondary)">rest</div>
<div style="height:26px;display:flex;align-items:center;padding-left:10px;font:var(--type-tree);color:var(--text-primary);background:var(--surface-hover)">hover — neutral overlay</div>
<div style="height:26px;display:flex;align-items:center;padding-left:10px;font:var(--type-tree);color:var(--text-primary);background:var(--surface-active)">press — stronger overlay</div>
<div style="height:26px;display:flex;align-items:center;padding-left:10px;font:var(--type-tree);color:var(--text-primary);background:var(--surface-selected);box-shadow:inset 2px 0 0 var(--border-accent)">selected — tint + 2px bar</div>
<div style="height:26px;display:flex;align-items:center;padding-left:10px;font:var(--type-tree);color:var(--text-secondary);background:var(--surface-inactive-selected)">selected, panel unfocused</div>
</div><div style="margin-top:10px;display:inline-block;font:var(--type-chrome);padding:4px 10px;border-radius:var(--radius-md);outline:var(--border-width-strong) solid var(--focus-ring);outline-offset:1px">focus ring</div></div>

</body></html>
