<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Git status colours — Nozoki</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="specimen.css"></head>
<body>
<div class="p" style="display:flex;gap:22px;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:8px"><span style="font:var(--type-status-letter);color:var(--git-added)">A</span><span class="k">Added</span><span style="width:22px;height:14px;background:var(--git-added);border-radius:var(--radius-sm)"></span></div>
<div style="display:flex;align-items:center;gap:8px"><span style="font:var(--type-status-letter);color:var(--git-modified)">M</span><span class="k">Modified</span><span style="width:22px;height:14px;background:var(--git-modified);border-radius:var(--radius-sm)"></span></div>
<div style="display:flex;align-items:center;gap:8px"><span style="font:var(--type-status-letter);color:var(--git-deleted)">D</span><span class="k">Deleted</span><span style="width:22px;height:14px;background:var(--git-deleted);border-radius:var(--radius-sm)"></span></div>
<div style="display:flex;align-items:center;gap:8px"><span style="font:var(--type-status-letter);color:var(--git-untracked)">U</span><span class="k">Untracked</span><span style="width:22px;height:14px;background:var(--git-untracked);border-radius:var(--radius-sm)"></span></div>
<div style="display:flex;align-items:center;gap:8px"><span style="font:var(--type-status-letter);color:var(--git-renamed)">R</span><span class="k">Renamed</span><span style="width:22px;height:14px;background:var(--git-renamed);border-radius:var(--radius-sm)"></span></div>
<div style="display:flex;align-items:center;gap:8px"><span style="font:var(--type-status-letter);color:var(--git-conflict)">C</span><span class="k">Conflicted</span><span style="width:22px;height:14px;background:var(--git-conflict);border-radius:var(--radius-sm)"></span></div>
</div>
<div class="p k">The letter carries the meaning; the colour repeats it. Remove all colour and this still reads (UX-A2).</div>

</body></html>
