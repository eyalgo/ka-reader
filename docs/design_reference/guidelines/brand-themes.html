<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Theme polarity — Nozoki</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="specimen.css"></head>
<body>
<div style="display:grid;grid-template-columns:1fr 1fr;height:170px">
<div style="background:var(--stone-2);padding:14px 16px"><div class="k">LIGHT — default with no platform signal</div><div style="margin-top:10px;background:var(--stone-0);border:1px solid var(--stone-3);border-radius:var(--radius-md);padding:8px 10px;font:var(--type-code);color:var(--stone-9)">const repo = <span style="color:var(--persimmon-700)">readOnly</span>(path)</div></div>
<div data-theme="dark" style="background:var(--stone-11);padding:14px 16px"><div class="k">DARK — equally maintained</div><div style="margin-top:10px;background:var(--stone-10);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:8px 10px;font:var(--type-code);color:var(--stone-3)">const repo = <span style="color:var(--persimmon-400)">readOnly</span>(path)</div></div>
</div>

</body></html>
