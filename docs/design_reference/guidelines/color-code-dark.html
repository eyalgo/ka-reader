<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Syntax palette, dark — Nozoki</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="specimen.css"></head>
<body>
<div data-theme="dark" style="background:var(--stone-11)"><div class="p"><pre style="margin:0;font:var(--type-code);background:var(--stone-10);border:var(--hairline);border-radius:var(--radius-md);padding:10px;color:var(--stone-3)"><span style="color:var(--code-comment)">// the view never lies</span>
<span style="color:var(--code-keyword)">const</span> repo = <span style="color:var(--code-function)">readOnly</span>(<span style="color:var(--code-string)">"~/code/nozoki"</span>);
<span style="color:var(--code-keyword)">if</span> (repo.changed &gt; <span style="color:var(--code-number)">0</span>) present(repo.<span style="color:var(--code-type)">status</span>);</pre>
<div class="k" style="margin-top:8px">Same roles, same restraint. The wrapper carries data-theme="dark", so these resolve from the tokens.</div></div></div>

</body></html>
