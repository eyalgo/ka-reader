[package]
name = "ka-reader-core"
version.workspace = true
edition = "2024"

[lints]
workspace = true

# The fakes a unit test is handed (`fs_reader::fakes`) are built for tests and for this feature alone,
# and no default feature turns it on, so a release build carries none. The crate names itself below so
# a `tests/` file reaches them too (`<CORE>/doctrine/engineering/languages/rust/testing.md`).
[features]
testing = []

[dev-dependencies]
ka-reader-core = { path = ".", features = ["testing"] }

[dependencies]
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
log = "0.4.34"
pulldown-cmark = { version = "0.13.6", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["fs"] }
thiserror = "2.0.20"
tree-sitter = "0.27.0"
tree-sitter-bash = "0.25.1"
tree-sitter-highlight = "0.27.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"

# The in-process walk `checks/read-only.sh` drives. No libtest harness: it is a program that prints
# one number, and the harness would print its own lines around it.
[[test]]
name = "walk"
harness = false
