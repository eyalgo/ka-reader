# Install the optional packages of BOTH Mac CPUs, whichever CPU runs the install.
# @tauri-apps/cli ships one binary package per CPU (…-darwin-arm64, …-darwin-x64) as optional
# dependencies. This keeps the INSTALLED set the same on either Mac CPU, which
# `pnpm install --frozen-lockfile` needs.
# It is not what `checks/no-network.sh` compares. That check reads every name
# `pnpm ls --depth Infinity` reports from the lockfile graph, installed or not, and diffs them
# against the `pnpm:` section of `checks/deps.allow`, so the compared set does not depend on what
# this machine installed.
# https://pnpm.io/settings/dependency-resolution#supportedarchitectures
supportedArchitectures:
  os:
    - darwin
  cpu:
    - arm64
    - x64
